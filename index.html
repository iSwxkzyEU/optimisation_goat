<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guild War Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- ÉCRAN MOT DE PASSE -->
  <div id="gate" class="gate">
    <div class="gate-box">
      <h1 class="logo"><i data-lucide="swords"></i> GUILD WAR PLANNER</h1>
      <p class="gate-sub">Accès réservé aux membres de la guilde</p>
      <input id="gate-input" type="password" placeholder="Mot de passe" autocomplete="off" />
      <button id="gate-btn">Entrer</button>
      <p id="gate-error" class="gate-error"></p>
    </div>
  </div>

  <!-- APPLICATION -->
  <div id="app" class="app hidden">
    <!-- Barre latérale -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand" data-route="home">
        <i data-lucide="swords"></i><span class="brand-text">GUILD WAR PLANNER</span>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-btn active" data-route="home"><i data-lucide="crosshair"></i><span>Nukes</span><span class="nav-count" id="nav-count-nukes">0</span></button>
        <button class="nav-btn" data-route="formations"><i data-lucide="layout-grid"></i><span>Formations</span></button>
      </nav>
      <div class="sidebar-soon">
        <span class="sidebar-label">À venir</span>
        <span class="sidebar-soon-item">Autres catégories…</span>
      </div>
      <div class="sidebar-foot"><i data-lucide="shield"></i> Guilde · 2026</div>
    </aside>

    <!-- Voile sombre (mobile) -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Contenu principal -->
    <div class="main">
      <header class="mobile-bar">
        <button class="icon-btn" id="menu-toggle"><i data-lucide="menu"></i></button>
        <span class="mobile-title"><i data-lucide="swords"></i> GUILD WAR PLANNER</span>
      </header>
      <main id="view" class="view"></main>
    </div>
  </div>

  <!-- MODALE (création / édition nuke, agrandissement image) -->
  <div id="modal" class="modal hidden">
    <div class="modal-backdrop" data-close></div>
    <div id="modal-content" class="modal-content"></div>
  </div>

  <!-- Lucide : la bibliothèque d'icônes officielle de shadcn -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <!-- Supabase : stockage partagé (base de données + fichiers) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/parser.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
