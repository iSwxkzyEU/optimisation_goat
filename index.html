<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guild War Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=2" />
</head>
<body>
  <!-- PASSWORD SCREEN -->
  <div id="gate" class="gate">
    <div class="gate-box">
      <h1 class="logo"><i data-lucide="swords"></i> GUILD WAR PLANNER</h1>
      <p class="gate-sub">Guild members only</p>
      <input id="gate-input" type="password" placeholder="Password" autocomplete="off" />
      <button id="gate-btn">Enter</button>
      <p id="gate-error" class="gate-error"></p>
    </div>
  </div>

  <!-- APPLICATION -->
  <div id="app" class="app hidden">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand" data-route="home">
        <i data-lucide="swords"></i><span class="brand-text">GUILD WAR PLANNER</span>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-btn active" data-route="home"><i data-lucide="star"></i><span>Priority targets</span><span class="nav-count" id="nav-count-home">0</span></button>
        <div class="sidebar-cats" id="sidebar-cats"></div>
        <button class="nav-btn cat-add" id="sidebar-add-cat"><i data-lucide="folder-plus"></i><span>New carousel</span></button>
        <div class="sidebar-sep"></div>
        <button class="nav-btn" data-route="best"><i data-lucide="crosshair"></i><span>Best nuke</span></button>
        <button class="nav-btn" data-route="smart"><i data-lucide="user-check"></i><span>Smart search</span></button>
        <div class="sidebar-sep"></div>
        <button class="nav-btn" data-route="formations"><i data-lucide="layout-grid"></i><span>Formations</span></button>
        <button class="nav-btn" data-route="history"><i data-lucide="history"></i><span>History</span></button>
      </nav>
      <div class="sidebar-foot"><i data-lucide="shield"></i> Guild · 2026</div>
    </aside>

    <!-- Dark overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Main content -->
    <div class="main">
      <header class="mobile-bar">
        <button class="icon-btn" id="menu-toggle"><i data-lucide="menu"></i></button>
        <span class="mobile-title"><i data-lucide="swords"></i> GUILD WAR PLANNER</span>
      </header>
      <main id="view" class="view"></main>
    </div>
  </div>

  <!-- MODAL (create / edit nuke, image zoom) -->
  <div id="modal" class="modal hidden">
    <div class="modal-backdrop" data-close></div>
    <div id="modal-content" class="modal-content"></div>
  </div>

  <!-- Lucide: shadcn's official icon library -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <!-- Supabase: shared storage (database + files) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- ?v= : version des scripts — à incrémenter à chaque mise à jour
       pour forcer les navigateurs à recharger le JS (anti-cache) -->
  <script src="js/parser.js?v=12"></script>
  <script src="js/optimizer.js?v=17"></script>
  <script src="js/variants.js?v=1"></script>
  <script src="js/store.js?v=11"></script>
  <script src="js/app.js?v=21"></script>
</body>
</html>
